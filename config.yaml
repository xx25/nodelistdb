# NodelistDB Configuration
# =========================
# Single configuration file for ALL NodelistDB components.
#
# COMPONENTS:
# - Parser: Uses only 'clickhouse' section
# - Server: Uses 'clickhouse', 'cache', and 'ftp' sections
# - Testdaemon: Uses all sections
#
# Quick Start:
# - Parser/Server: Uncomment and configure 'clickhouse' section below
# - Testdaemon: Configure all sections as needed

# ============================================================================
# CLICKHOUSE DATABASE (Required for ALL components)
# ============================================================================
# =============================================================================
# FTN NETWORKS (multi-network support)
# =============================================================================
# Networks known to the system. When this section is absent, a single default
# entry for fidonet is used, so single-network installs need no changes.
# The parser's -network flag must name one of these entries; nodelist_pattern
# is a regex matched against nodelist filenames (.gz stripped before matching).
#
# networks:
#   - name: fidonet
#     nodelist_pattern: '(?i)^nodelist'      # default: traditional nodelist.* names
#   - name: fsxnet
#     nodelist_pattern: '(?i)^fsxnet\.\d{3}$' # default for non-fidonet: <name>.DDD

clickhouse:
  host: localhost              # ClickHouse server hostname
  port: 9000                   # Native protocol port (9000 = default)
  database: nodelistdb         # Database name
  username: default            # Database user
  password: ""                 # Database password (empty for default user)
  use_ssl: false               # Enable SSL/TLS connection

  # Connection Pool Settings
  max_open_conns: 10           # Maximum open connections
  max_idle_conns: 5            # Maximum idle connections
  dial_timeout: 30s            # Connection timeout
  read_timeout: 5m             # Query read timeout
  write_timeout: 1m            # Query write timeout
  compression: lz4             # Compression: none, lz4, zstd, gzip

  # Testdaemon-only settings (ignored by parser/server)
  batch_size: 1000             # Batch size for bulk inserts
  flush_interval: 30s          # Batch flush interval

# Production ClickHouse: host: 10.121.17.211

# ============================================================================
# CACHE (Server only - optional)
# ============================================================================
# Note: Only BadgerCache is supported (persistent BadgerDB backend)
cache:
  enabled: false               # Enable caching for server
  path: ./cache/badger         # Cache directory

  # Badger-specific settings
  max_memory_mb: 256           # Maximum memory for cache
  value_log_max_mb: 100        # Maximum value log size
  compact_on_close: true       # Compact database on close
  gc_interval: 10m             # Garbage collection interval
  gc_discard_ratio: 0.5        # GC discard ratio

  # Disk budget, checked once per gc_interval. 0 (the default) means no cap.
  # Over budget, the cache stops accepting new entries and lets TTL expiry
  # drain it; reads keep being served throughout. If it is still over budget
  # three checks later - draining needs compaction, and compaction needs
  # writes - the store is reset. Set this comfortably above the working set:
  # badger reports the logical size of its files, and a fresh value log alone
  # reports twice value_log_max_mb.
  # max_disk_mb: 0

  # Cache TTL settings
  default_ttl: 5m              # Default cache TTL
  node_ttl: 15m                # Node data TTL
  stats_ttl: 1h                # Statistics TTL
  search_ttl: 5m               # Search results TTL
  max_search_results: 500      # Maximum cached search results
  warmup_on_start: false       # Pre-load cache on startup
  clear_all_on_import: false   # Clear cache when importing data

# ============================================================================
# FTP SERVER (Server only - optional)
# ============================================================================
# Anonymous read-only FTP server for distributing nodelist files
ftp:
  enabled: false               # Enable FTP server
  host: "0.0.0.0"              # Bind address (0.0.0.0 = all interfaces)
  port: 2121                   # FTP port (2121 for non-root, 21 requires root)

  # Virtual path mounts (recommended - supports multiple directories)
  # If not specified, falls back to nodelist_path mounted at /fidonet/nodelists
  mounts:
    - virtual_path: /fidonet/nodelists  # Path in FTP filesystem
      real_path: /home/dp/nodelists     # Real filesystem path
    # Add more mounts here for additional directories:
    # - virtual_path: /fidonet/files
    #   real_path: /home/dp/files

  # Legacy: Single directory mount (deprecated - use mounts instead)
  # nodelist_path: /home/dp/nodelists  # Auto-mounted at /fidonet/nodelists if mounts is empty

  # Connection limits
  max_connections: 10          # Maximum concurrent connections
  idle_timeout: 300s           # Connection idle timeout (5 minutes)

  # Passive mode configuration (for NAT/firewalls)
  passive_port_min: 50000      # Passive mode port range start
  passive_port_max: 50100      # Passive mode port range end
  public_host: ""              # Public IP for PASV (empty = auto-detect)

  # Security settings
  disable_active_ip_check: false  # Disable IP matching for active mode (PORT/EPRT)
                                  # Set to true if clients behind NAT need active mode
                                  # Default: false (security enabled)

# Security: Anonymous-only, read-only, chrooted to nodelist_path, no SSL

# ============================================================================
# EXTERNAL LINKS (Server only - optional)
# ============================================================================
# Path to YAML file containing external FidoNet links for the Links page.
# This file is hot-reloaded - changes take effect without server restart.
# See links.example.yaml for format documentation.
links_file: links.yaml

# ============================================================================
# TESTDAEMON CONFIGURATION (Testdaemon only - ignored by parser/server)
# ============================================================================

# Test Daemon Settings
# ---------------------
daemon:
  test_interval: 72h           # Regular test interval for operational nodes
  stale_test_threshold: 72h    # Consider test stale after this duration
  failed_retry_interval: 24h   # Retry failed nodes after this duration
  workers: 10                  # Number of concurrent test workers
  batch_size: 100              # Batch size for processing nodes

  # Command-line only flags (not in config):
  # -run-once     : Run one test cycle and exit
  # -dry-run      : Test without storing results
  # -cli-only     : Only run CLI, no automatic testing
  # -test <addr>  : Test specific node (e.g., "2:5053/56")

# Protocol Testing
# ----------------
protocols:
  # BinkP (IBN flag) - FTN mail protocol over TCP/IP
  binkp:
    enabled: true
    port: 24554                # Default BinkP port
    timeout: 30s               # Connection timeout (some binkd hosts stall >10s on first contact)
    our_address: "2:5001/5001.5001" # Your FidoNet address for handshake (required)
    system_name: "NodelistDB Test Daemon"  # System name (SYS)
    sysop: "Test Operator"     # Sysop name (ZYZ)
    location: "Test Location"  # Location (LOC)

  # IFCICO/EMSI (IFC flag) - Legacy FTN mailer protocol
  ifcico:
    enabled: true
    port: 60179                # Default IFCICO port
    timeout: 30s               # Connection timeout (EMSI needs more time)
    our_address: "2:5001/5001.5001"
    system_name: "NodelistDB Test Daemon"
    sysop: "Test Operator"
    location: "Test Location"

  # Telnet (ITN flag) - BBS access
  telnet:
    enabled: false
    port: 23                   # Standard telnet port
    timeout: 5s

  # FTP (IFT flag) - File transfer
  ftp:
    enabled: false
    port: 21                   # Standard FTP port
    timeout: 10s

  # Virtual Modem (IVM flag) - Virtual modem over IP
  # The tester identifies what protocol actually runs on the announced IVM port
  # and reports it: vmodem_conformant is true only for a genuine VMODEM (VMP)
  # responder; otherwise vmodem_variant names the actual protocol (emsi-telnet,
  # emsi-raw, binkp, telnet-login, ...) and vmodem_software the mailer.
  # NOTE: vmodem_success now means "reachable and speaks a recognized protocol",
  # NOT "TCP port open". Enabling this after a period disabled will cause a
  # step-change in vmodem_success trend queries (whois_operations argMax,
  # test_aka_mismatch, test_ipv6_queries). Record the enable date.
  vmodem:
    enabled: false
    port: 3141                 # Default IVM port; per-node IVM:<port> overrides honored
    timeout: 10s

    # Outgoing Virtual Modem Protocol calls.
    #
    # A real VMP call is the only way to read a VMODEM node's address, system
    # name and sysop, but VMP is a two-connection protocol: after we ask to
    # connect, the ANSWERING node dials a second binary data connection BACK to
    # us, and only then rings its mailer. So this only works when the daemon
    # host accepts inbound TCP from the nodes it tests. When it cannot, calls
    # still identify the node as a VMODEM and report "could not reach our data
    # channel" instead of an identity.
    #
    # Leave port_min/port_max at 0 for an ephemeral port (right when the whole
    # ephemeral range is reachable). Set a range when a firewall rule has to
    # name it — it needs at least as many ports as the daemon has workers,
    # since tests run concurrently.
    # Which port to advertise matters. VMODEM's own caller always tries 14592
    # first, so a node whose firewall was ever set up "for VMODEM" permits that
    # port and not much else: 2:371/52 refuses a callback to 50090 outright but
    # completes the call on 14592.
    #
    # On oracle-main the VCN security list permits inbound only on 80/443,
    # 14592 and 50000-50100; anything else is dropped at the cloud edge, where
    # it is also invisible to tcpdump on the instance. Always verify the range
    # from a third-party host, not just by binding locally.
    # 14592 alone is the compatible choice, and costs little: only a handful of
    # nodes in the whole nodelist answer VMP, so serializing them adds well
    # under a minute to a cycle. Setting port_min/port_max as well allows
    # concurrent calls, at the risk that a node which only permits 14592
    # answers reason 4 when it gets handed a fallback port.
    data_channel:
      enabled: false
      host: ""                 # bind address ("" = all interfaces)
      preferred_port: 14592    # VMODEM's own first-choice callback port
      port_min: 0              # no fallback range: one call at a time, always on 14592
      port_max: 0
      ring_timeout: 45s        # how long to let the remote ring its mailer

# External Services
# -----------------
services:
  # DNS resolution for hostnames
  dns:
    workers: 20                # Concurrent DNS resolution workers
    timeout: 5s                # DNS query timeout
    cache_ttl: 24h             # DNS result cache duration

  # IP Geolocation
  geolocation:
    provider: ip-api           # Provider: ip-api, ipinfo, ipgeolocation
    api_key: ""                # API key (required for ipgeolocation)
    cache_ttl: 168h            # Cache duration (7 days)
    rate_limit: 150            # Requests per minute

  # Email endpoint verification (backs the /analytics/email report)
  #
  # Checks whether the mail domains published in nodelist email flags
  # (IEM, IMI, ITX, ISE, IUC, and the non-standard EMA/EVY) can still
  # receive mail. Plain DNS only: MX lookup, RFC 7505 null MX, RFC 5321
  # implicit MX, and resolution of every MX target.
  #
  # No SMTP connection is ever made. Outbound port 25 is blocked on the
  # production host, and RCPT-TO callback verification is unreliable
  # (catch-all domains, greylisting) as well as reputationally risky.
  #
  # Requires schema/migrations/014_email_domain_checks.sql.
  email_verify:
    enabled: false             # Off by default; this is a reporting aid
    interval: 24h              # How often to sweep (the domain set changes daily at most)
    stale_after: 168h          # Re-check a domain after 7 days
    timeout: 5s                # Per-lookup DNS timeout
    concurrency: 4             # Simultaneous domain checks

# Testdaemon Cache (Persistent cache for testdaemon)
# ------------------
testdaemon_cache:
  enabled: true
  type: badger                 # Only badger supported for testdaemon
  path: ./cache/badger-testdaemon  # Separate cache from server

# Logging Configuration (Separate for each component)
# ========================================================

# Server Logging (Web server and API)
# ------------------------------------
server_logging:
  level: info                  # Log level: debug, info, warn, error
  file: /var/log/nodelistdb-server.log  # Log file path
  max_size: 100                # Max log file size (MB)
  max_backups: 7               # Number of old log files to keep
  max_age: 30                  # Days to retain old logs
  console: true                # Also log to console
  json: false                  # Use JSON format (false = text)

# Parser Logging (Nodelist import tool)
# --------------------------------------
parser_logging:
  level: info                  # Log level: debug, info, warn, error
  file: /var/log/nodelistdb-parser.log  # Log file path
  max_size: 50                 # Max log file size (MB)
  max_backups: 3               # Number of old log files to keep
  max_age: 30                  # Days to retain old logs
  console: true                # Also log to console
  json: false                  # Use JSON format (false = text)

# Testdaemon Logging (Node testing daemon)
# -----------------------------------------
testdaemon_logging:
  level: debug                 # Log level: debug, info, warn, error
  file: /home/dp/nodelistdb/logs/nodetest-daemon.log  # Log file path
  max_size: 100                # Max log file size (MB)
  max_backups: 7               # Number of old log files to keep
  max_age: 30                  # Days to retain old logs
  console: true                # Also log to console
  json: false                  # Use JSON format (false = text)

# CLI Interface (Testdaemon only)
# --------------
cli:
  enabled: true
  host: 127.0.0.1              # Bind address (127.0.0.1 = localhost only)
  port: 2323                   # CLI telnet port
  max_clients: 5               # Maximum concurrent clients
  timeout: 5m                  # Client idle timeout
  prompt: "> "                 # CLI prompt
  welcome_message: |
    NodelistDB Test Daemon CLI v1.0.0
    Type 'help' for available commands.

# ============================================================================
# COMMAND-LINE USAGE
# ============================================================================
# Parser:  ./bin/parser -config config.yaml -path /path/to/nodelists [options]
# Server:  ./bin/server -config config.yaml [-host HOST] [-port PORT]
# Daemon:  ./bin/testdaemon -config config.yaml [options]
#
# See README.md or run with -help for full command-line options
