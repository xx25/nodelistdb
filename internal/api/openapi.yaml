  - name: Points
    description: Pointlist (FTS-5002) entries and imported pointlist issues
  - name: Sysops
    description: System operators
  - name: Statistics
    description: Networks, nodelist dates and per-date statistics
  - name: Reachability
    description: What the testing daemon found - per node, as trends, and by netmail PING
  - name: Software Analytics
    description: Mailer software seen in handshakes
  - name: Geographic Analytics
    description: Where nodes are hosted
  - name: Reference
    description: Flag documentation
  - name: Nodelists
    description: Nodelist files
  - name: Modem Testing
    description: Authenticated endpoints for the modem test caller
  - name: Operations
    description: Server counters, registered only when the feature is on
  - name: Documentation
    description: This specification and its UI

externalDocs:
