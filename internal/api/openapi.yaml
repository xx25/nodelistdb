    TimelineEvent:
      type: object
      description: >
        One timeline entry. type "active" carries the nodelist entry in data;
        type "removed" marks a gap and carries its length in duration
        (nanoseconds).
      properties:
        date:
          type: string
          format: date-time
        day_number:
          type: integer
        type:
          type: string
          enum: [active, removed]
        data:
          allOf:
            - $ref: '#/components/schemas/Node'
          description: Omitted on removed events.
        duration:
          type: integer
          description: Gap length in nanoseconds. Omitted on active events.
