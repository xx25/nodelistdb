  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: |
        A caller-specific API key. The server stores its SHA-256 hash in
        modem_api.callers; see the README for generating a pair.

  responses:
    BadRequest:
      description: Invalid or missing parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such record
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: >
        Rate limited. The body is plain text and Retry-After says how many
        seconds to wait.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        text/plain:
          schema:
            type: string
    BudgetExceeded:
      description: The query outran its time budget; narrow it or retry later
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  parameters:
    Zone:
      name: zone
      in: path
      required: true
      description: FTN zone number (FidoNet uses 1-6; other networks have their own)
      schema:
        type: integer
        minimum: 1
    Net:
      name: net
      in: path
      required: true
      description: Network number (0-65535)
      schema:
        type: integer
        minimum: 0
        maximum: 65535
    Node:
      name: node
      in: path
      required: true
      description: Node number (0-65535)
      schema:
        type: integer
        minimum: 0
        maximum: 65535
    PointNumber:
      name: point
      in: path
      required: true
      description: Point number under the boss
      schema:
        type: integer
        minimum: 0
    DomainResolved:
      name: domain
      in: query
      description: >
        FTN network. Omitted: the only network the address exists in, or
        fidonet when it exists in several.
      schema:
        type: string
        example: fsxnet
    DomainDefaultFidonet:
      name: domain
      in: query
      description: FTN network (defaults to fidonet)
      schema:
        type: string
        default: fidonet
    DomainDefaultAll:
      name: domain
      in: query
      description: FTN network to report on (omitted = every network together)
      schema:
        type: string
    AnalyticsDays:
      name: days
      in: query
      description: Look-back window in days (values above 3650 are capped)
      schema:
        type: integer
        minimum: 1
        default: 365

