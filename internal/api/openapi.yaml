openapi: 3.0.3
info:
  title: NodelistDB API
  description: |
    NodelistDB is a comprehensive API for accessing historical FTN nodelist
    data: every FidoNet nodelist since 1986, other FTN networks (fsxNet, ...),
    pointlists (FTS-5002), and what the testing daemon found when it called
    each node.

    ## Features
    - **Node search**: find nodes by zone, net, node number, system name,
      location, sysop, capability flags or date range, in any network
    - **Historical data**: the complete history, change log and timeline of
      any node
    - **Multi-network**: `GET /api/networks` lists the imported FTN networks;
      most endpoints take `?domain=`
    - **Points**: pointlist snapshots under a boss, point history, imported
      pointlist issues
    - **Statistics**: per-date network statistics and the list of nodelist dates
    - **Reachability**: the testing daemon's results per node (BinkP, IFCICO,
      Telnet, FTP, VModem, over IPv4 and IPv6), trends and searches
    - **Software, hosting, PING/TRACE analytics**: distributions computed from
      those tests, and the netmail PING measurements
    - **Flag documentation**: a reference for FidoNet node flags

    ## Multi-network conventions
    A node address is only unique within one FTN network. Endpoints about one
    address resolve the network in this order: an explicit `?domain=`; the
    only network the address exists in; `fidonet` when it exists in several.
    Responses that describe one address say which network answered
    (`domain`) and which ones it exists in (`available_domains`, or the
    `X-Available-Domains` header where the body is the record itself).
    Listing and analytics endpoints default to `fidonet` or to every network
    as their descriptions say.

    ## Errors and limits
    Errors are JSON `{error, status, time}`. Search endpoints require at
    least one constraint and answer `400` without one. Every `limit`
    parameter has a ceiling; values above it are capped silently on the
    search endpoints and rejected on the reachability endpoints, as each
    parameter's description says.

    Requests are rate limited per client IP with token buckets: the endpoints
    tagged as expensive (node, point, stats, sysop, analytics, software and
    reachability reads, and `/api/networks`) share a small allowance, the
    rest a larger one. A rejected request gets `429` with a plain-text body
    and a `Retry-After` header. A query that outruns its time budget gets
    `503`. Either can happen on any endpoint that reads the database.
  version: 1.1.0
  contact:
    name: NodelistDB
    url: https://github.com/nodelistdb/nodelistdb
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

# Every path below already carries its /api prefix, so the server root is
# the site root. A server URL of /api here would make Swagger UI request
# /api/api/... - that is exactly what an earlier revision did.
servers:
  - url: /
    description: This server

paths:
  /api/health:
    get:
      summary: Health Check
      description: |
        Server health. With the health checker installed (the normal
        deployment) this reports uptime, build, database and cache state and
        the latest nodelist; a bare server answers `{status, time}` only.
      operationId: getHealth
      tags:
        - System
      responses:
        '200':
          description: Health report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /api/networks:
    get:
      summary: List FTN Networks
      description: >
        The FTN networks (domains) present in the database, each with its
        latest nodelist date and node count on that date.
      operationId: getNetworks
      tags:
        - Statistics
      responses:
        '200':
          description: Networks present in the database
          content:
            application/json:
              schema:
                type: object
                properties:
                  networks:
                    type: array
                    items:
                      $ref: '#/components/schemas/NetworkInfo'
                  count:
                    type: integer
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/nodes:
    get:
      summary: Search Nodes
      description: |
        Search nodelist entries. At least one constraint is required (zone,
        net, node, system_name, location, sysop_name, node_type, is_cm, is_mo,
        has_inet, has_binkp or a date bound); a search with none is refused
        with 400. Without `latest_only`, every historical entry that matches
        is returned, newest first.
      operationId: searchNodes
      tags:
        - Nodes
      parameters:
        - name: domain
          in: query
          description: FTN network to search in (omit to search all networks)
          schema:
            type: string
            example: fsxnet
        - name: zone
          in: query
          description: FTN zone number
          schema:
            type: integer
            minimum: 1
            example: 2
        - name: net
          in: query
          description: Network number within the zone
          schema:
            type: integer
            minimum: 0
            maximum: 65535
            example: 5001
        - name: node
          in: query
          description: Node number within the network
          schema:
            type: integer
            minimum: 0
            maximum: 65535
            example: 100
        - name: system_name
          in: query
          description: System name (substring, case-insensitive, at least 2 characters)
          schema:
            type: string
            example: "Linux BBS"
        - name: location
          in: query
          description: Location (substring, case-insensitive, at least 2 characters)
          schema:
            type: string
            example: "Moscow"
        - name: sysop_name
          in: query
          description: Sysop name (substring, case-insensitive, at least 2 characters)
          schema:
            type: string
            example: "John Doe"
        - name: node_type
          in: query
          description: Node type (Zone, Region, Host, Hub, Pvt, Down, Hold)
          schema:
            type: string
            example: "Hub"
        - name: is_cm
          in: query
          description: Filter by the CM (Continuous Mail) flag
          schema:
            type: boolean
        - name: is_mo
          in: query
          description: Filter by the MO (Mail Only) flag
          schema:
            type: boolean
        - name: has_inet
          in: query
          description: Filter by the presence of any internet connectivity flag
          schema:
            type: boolean
        - name: has_binkp
          in: query
          description: Filter by BinkP capability (IBN)
          schema:
            type: boolean
        # is_active is intentionally absent: it was documented here but never
        # implemented, so passing it silently returned unfiltered results. Use
        # latest_only for "one entry per node". A real "still listed in the
        # current nodelist" filter is tracked separately - true is expressible
        # as a row predicate, false is not, so it needs its own query shape.
        - name: date_from
          in: query
          description: Earliest nodelist date to include (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2024-01-01"
        - name: date_to
          in: query
          description: Latest nodelist date to include (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2024-12-31"
        - name: latest_only
          in: query
          description: >
            Return only the most recent entry for each node. This is per
            node, not "still listed": a node that left the nodelist years ago
            still returns its final entry.
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          description: Maximum number of results (default 100; values above 500 are capped to 500)
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          description: Number of results to skip (for pagination)
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Node'
                  count:
                    type: integer
                    description: Number of nodes returned
                  filter:
                    $ref: '#/components/schemas/NodeSearchFilter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/nodes/pstn:
    get:
      summary: Get PSTN Nodes
      description: |
        Every node in the latest nodelist with a usable phone number, for
        modem testing. Nodes marked dead via /api/modem/pstn-dead are
        excluded.
      operationId: getPSTNNodes
      tags:
        - Nodes
      parameters:
        - $ref: '#/components/parameters/DomainDefaultFidonet'
        - name: zone
          in: query
          description: Restrict to one zone
          schema:
            type: integer
        - name: limit
          in: query
          description: Maximum nodes to return (default 5000; values above 10000 are capped)
          schema:
            type: integer
            default: 5000
            maximum: 10000
      responses:
        '200':
          description: PSTN-capable nodes
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: '#/components/schemas/PSTNNode'
                  count:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/nodes/pstn/dead:
    get:
      summary: List Dead PSTN Nodes
      description: Nodes marked as not answering by a modem test caller.
      operationId: listPSTNDeadNodes
      tags:
        - Nodes
      responses:
        '200':
          description: Nodes currently marked dead
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: '#/components/schemas/PSTNDeadNode'
                  count:
                    type: integer
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/nodes/pstn/recent-success:
    get:
      summary: Get Recently Reached Phone Numbers
      description: |
        Phone numbers a modem test reached successfully within the window, so
        a caller can skip them.
      operationId: getRecentModemSuccessPhones
      tags:
        - Nodes
      parameters:
        - name: days
          in: query
          description: Look-back window in days (1-90)
          schema:
            type: integer
            default: 7
            minimum: 1
            maximum: 90
      responses:
        '200':
          description: Phone numbers reached in the window
          content:
            application/json:
              schema:
                type: object
                properties:
                  phones:
                    type: array
                    items:
                      type: string
                  count:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/nodes/{zone}/{net}/{node}:
    get:
      summary: Get Node
      description: |
        The most recent nodelist entry of one address. When the address exists
        in several FTN networks, the `X-Available-Domains` response header
        lists them (comma-separated); select one with `?domain=`.
      operationId: getNode
      tags:
        - Nodes
      parameters:
        - $ref: '#/components/parameters/Zone'
        - $ref: '#/components/parameters/Net'
        - $ref: '#/components/parameters/Node'
        - $ref: '#/components/parameters/DomainResolved'
      responses:
        '200':
          description: Node found
          headers:
            X-Available-Domains:
              description: Present when the address exists in more than one network
              schema:
                type: string
                example: fidonet,fsxnet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/nodes/{zone}/{net}/{node}/history:
    get:
      summary: Get Node History
      description: Every nodelist entry of one address, oldest first, with the span it covers.
      operationId: getNodeHistory
      tags:
        - Nodes
      parameters:
        - $ref: '#/components/parameters/Zone'
        - $ref: '#/components/parameters/Net'
        - $ref: '#/components/parameters/Node'
        - $ref: '#/components/parameters/DomainResolved'
      responses:
        '200':
          description: Node history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AddressEnvelope'
                  - type: object
                    properties:
                      history:
                        type: array
                        items:
                          $ref: '#/components/schemas/Node'
                      count:
                        type: integer
                      first_date:
                        type: string
                        format: date-time
                      last_date:
                        type: string
                        format: date-time
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/nodes/{zone}/{net}/{node}/changes:
    get:
      summary: Get Node Changes
      description: |
        The change log of one address: one entry per nodelist date on which
        the node was added, removed or modified, with the fields that changed.
        An address with no history answers an empty list.
      operationId: getNodeChanges
      tags:
        - Nodes
      parameters:
        - $ref: '#/components/parameters/Zone'
        - $ref: '#/components/parameters/Net'
        - $ref: '#/components/parameters/Node'
        - $ref: '#/components/parameters/DomainResolved'
      responses:
        '200':
          description: Node changes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AddressEnvelope'
                  - type: object
                    properties:
                      changes:
                        type: array
                        items:
                          $ref: '#/components/schemas/NodeChange'
                      count:
                        type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/nodes/{zone}/{net}/{node}/timeline:
    get:
      summary: Get Node Timeline
      description: |
        The node's history as a sequence of events for a timeline chart: an
        `active` event per nodelist entry, and a `removed` event wherever
        more than two weeks passed before the next entry.
      operationId: getNodeTimeline
      tags:
        - Nodes
      parameters:
        - $ref: '#/components/parameters/Zone'
        - $ref: '#/components/parameters/Net'
        - $ref: '#/components/parameters/Node'
        - $ref: '#/components/parameters/DomainResolved'
      responses:
        '200':
          description: Node timeline
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AddressEnvelope'
                  - type: object
                    properties:
                      timeline:
                        type: array
                        items:
                          $ref: '#/components/schemas/TimelineEvent'
                      count:
                        type: integer
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/nodes/{zone}/{net}/{node}/points:
    get:
      summary: Get Points Under a Boss Node
      description: |
        The pointlist snapshot under a boss node: per pointlist series the
        latest issue at or before the as-of date (within a 60-day staleness
        window), with overlapping entries resolved to the most authoritative
        series (net-level < regional < zone rollup).
      operationId: getNodePoints
      tags:
        - Points
      parameters:
        - $ref: '#/components/parameters/Zone'
        - $ref: '#/components/parameters/Net'
        - $ref: '#/components/parameters/Node'
        - name: date
          in: query
          description: As-of date (YYYY-MM-DD); defaults to the newest imported issue
          schema:
            type: string
            format: date
        - name: domain
          in: query
          description: FTN network (defaults to the network the boss's points exist in)
          schema:
            type: string
      responses:
        '200':
          description: Points under the boss
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AddressEnvelope'
                  - type: object
                    properties:
                      points:
                        type: array
                        items:
                          $ref: '#/components/schemas/Point'
                      count:
                        type: integer
                      as_of:
                        type: string
                        format: date
                        description: Present only when ?date= was given
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/nodes/{zone}/{net}/{node}/ping:
    get:
      summary: Get Node Netmail PING History
      description: |
        Every FTS-4010 netmail PING sent to the node by the testdaemon, with the
        outbound path the robot quoted back (hop by hop, from the ^AVia chain),
        the answer's own return path, round-trip time and robot software, plus
        the replies behind them (pongs, transit TRACE notices, bounces). Reply
        bodies are never published.
      operationId: getNodePing
      tags:
        - Reachability
      parameters:
        - $ref: '#/components/parameters/Zone'
        - $ref: '#/components/parameters/Net'
        - $ref: '#/components/parameters/Node'
        - $ref: '#/components/parameters/DomainResolved'
        - name: limit
          in: query
          description: Maximum pings to return, newest first (1-500; other values fall back to 50)
          schema:
            type: integer
            default: 50
            maximum: 500
      responses:
        '200':
          description: Ping history and replies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AddressEnvelope'
                  - type: object
                    properties:
                      pings:
                        type: array
                        items:
                          $ref: '#/components/schemas/Ping'
                      replies:
                        type: array
                        items:
                          $ref: '#/components/schemas/PingReply'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/nodes/{zone}/{net}/{node}/tests:
    get:
      summary: Get Node Test History
      description: |
        The testing daemon's results for one node within the window, oldest
        first, with aggregate statistics over the same window. A node that was
        never tested answers an empty list and null statistics, not 404.
        Multi-hostname nodes contribute one row per hostname plus one
        aggregated row (`is_aggregated`).
      operationId: getNodeTests
      tags:
        - Reachability
      parameters:
        - $ref: '#/components/parameters/Zone'
        - $ref: '#/components/parameters/Net'
        - $ref: '#/components/parameters/Node'
        - $ref: '#/components/parameters/DomainResolved'
        - name: days
          in: query
          description: Look-back window in days (1-365; values outside are rejected)
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 365
      responses:
        '200':
          description: Test history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AddressEnvelope'
                  - type: object
                    properties:
                      days:
                        type: integer
                      tests:
                        type: array
                        items:
                          $ref: '#/components/schemas/NodeTestResult'
                      count:
                        type: integer
                      stats:
                        allOf:
                          - $ref: '#/components/schemas/NodeReachabilityStats'
                        nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/nodes/{zone}/{net}/{node}/tests/detail:
    get:
      summary: Get One Test Result
      description: |
        One test result in full, identified by its `test_time` exactly as
        reported in the node's test history. The timestamp is a query
        parameter rather than a path segment so that percent-encoded zone
        offsets survive routing.
      operationId: getNodeTestDetail
      tags:
        - Reachability
      parameters:
        - $ref: '#/components/parameters/Zone'
        - $ref: '#/components/parameters/Net'
        - $ref: '#/components/parameters/Node'
        - $ref: '#/components/parameters/DomainResolved'
        - name: time
          in: query
          required: true
          description: The result's test_time, RFC 3339
          schema:
            type: string
            format: date-time
            example: "2026-09-10T12:00:00Z"
      responses:
        '200':
          description: The test result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeTestResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/reachability/trends:
    get:
      summary: Get Reachability Trends
      description: |
        Per day, how many nodes the daemon tested and how many were
        operational, with the average response time: the series behind the
        /reachability chart.
      operationId: getReachabilityTrends
      tags:
        - Reachability
      parameters:
        - $ref: '#/components/parameters/DomainDefaultAll'
        - name: days
          in: query
          description: Window in days; omitted or 0 means the whole history (values above 3650 are rejected)
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 3650
      responses:
        '200':
          description: Daily trend
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain:
                    type: string
                  days:
                    type: integer
                  trends:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReachabilityTrend'
                  count:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/reachability/nodes:
    get:
      summary: Search Test Results
      description: |
        Each node's newest test result within the window, newest first,
        narrowed by outcome and by which protocol succeeded. Both filters are
        applied before the limit, so a rarely successful protocol is found
        wherever it sits.
      operationId: searchReachability
      tags:
        - Reachability
      parameters:
        - $ref: '#/components/parameters/DomainDefaultAll'
        - name: status
          in: query
          description: operational, failed, or omitted/all for both
          schema:
            type: string
            enum: [operational, failed, all]
        - name: protocol
          in: query
          description: >
            Keep only nodes whose newest test succeeded over this protocol
            (vmodem means a confirmed VMP responder); omitted/any for all
          schema:
            type: string
            enum: [binkp, ifcico, telnet, ftp, vmodem, any]
        - name: days
          in: query
          description: Look-back window in days (1-365; values outside are rejected)
          schema:
            type: integer
            default: 1
            minimum: 1
            maximum: 365
        - name: limit
          in: query
          description: Maximum nodes to return (1-1000; values outside are rejected)
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 1000
      responses:
        '200':
          description: Matching test results
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: '#/components/schemas/NodeTestResult'
                  count:
                    type: integer
                  filter:
                    $ref: '#/components/schemas/ReachabilitySearchFilter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/points:
    get:
      summary: Search Points
      description: |
        Search pointlist entries. Requires at least one constraint (zone, net,
        node, point, system_name, location, sysop_name, list_source, or date
        range). With latest_only=true the search applies snapshot semantics
        (one row per 4-D address, cross-source overlap resolved); otherwise
        every matching historical row is returned, newest first.
      operationId: searchPoints
      tags:
        - Points
      parameters:
        - name: zone
          in: query
          schema:
            type: integer
        - name: net
          in: query
          schema:
            type: integer
        - name: node
          in: query
          description: Boss node number
          schema:
            type: integer
        - name: point
          in: query
          description: Point number
          schema:
            type: integer
        - name: domain
          in: query
          description: FTN network (omit for all networks)
          schema:
            type: string
        - name: list_source
          in: query
          description: Pointlist series (r24, z2, ...)
          schema:
            type: string
        - name: system_name
          in: query
          description: System name (substring, case-insensitive, at least 2 characters)
          schema:
            type: string
        - name: location
          in: query
          description: Location (substring, case-insensitive, at least 2 characters)
          schema:
            type: string
        - name: sysop_name
          in: query
          description: Sysop name (substring, case-insensitive, at least 2 characters)
          schema:
            type: string
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          description: End of date range; with latest_only=true also the snapshot as-of date
          schema:
            type: string
            format: date
        - name: latest_only
          in: query
          description: Apply snapshot semantics (one row per 4-D address)
          schema:
            type: boolean
        - name: limit
          in: query
          description: Maximum number of results (default 100; values above 500 are capped to 500)
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  points:
                    type: array
                    items:
                      $ref: '#/components/schemas/Point'
                  count:
                    type: integer
                  filter:
                    $ref: '#/components/schemas/PointSearchFilter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/points/{zone}/{net}/{node}/{point}:
    get:
      summary: Get Point
      description: |
        The current snapshot entry of one 4-D point address. When the
        address exists in several FTN networks, the X-Available-Domains
        response header lists them; select one with ?domain=.
      operationId: getPoint
      tags:
        - Points
      parameters:
        - $ref: '#/components/parameters/Zone'
        - $ref: '#/components/parameters/Net'
        - $ref: '#/components/parameters/Node'
        - $ref: '#/components/parameters/PointNumber'
        - $ref: '#/components/parameters/DomainResolved'
      responses:
        '200':
          description: Point retrieved successfully
          headers:
            X-Available-Domains:
              description: Present when the address exists in more than one network
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Point'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/points/{zone}/{net}/{node}/{point}/history:
    get:
      summary: Get Point History
      description: |
        Every stored entry of one 4-D point address across all pointlist
        series and issue dates. Rows are labeled with list_source;
        overlapping series are not collapsed.
      operationId: getPointHistory
      tags:
        - Points
      parameters:
        - $ref: '#/components/parameters/Zone'
        - $ref: '#/components/parameters/Net'
        - $ref: '#/components/parameters/Node'
        - $ref: '#/components/parameters/PointNumber'
        - $ref: '#/components/parameters/DomainResolved'
      responses:
        '200':
          description: Point history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AddressEnvelope'
                  - type: object
                    properties:
                      history:
                        type: array
                        items:
                          $ref: '#/components/schemas/Point'
                      count:
                        type: integer
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/pointlists/dates:
    get:
      summary: List Imported Pointlist Files
      description: Imported pointlist issues (per series), newest first.
      operationId: getPointlistDates
      tags:
        - Points
      parameters:
        - $ref: '#/components/parameters/DomainDefaultFidonet'
        - name: source
          in: query
          description: Restrict to one pointlist series (r24, z2, ...)
          schema:
            type: string
      responses:
        '200':
          description: Pointlist files
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      $ref: '#/components/schemas/PointlistFile'
                  count:
                    type: integer
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/pointlists/sources:
    get:
      summary: List Pointlist Sources
      description: The imported pointlist series with their coverage, file and point counts.
      operationId: getPointlistSources
      tags:
        - Points
      parameters:
        - $ref: '#/components/parameters/DomainDefaultFidonet'
      responses:
        '200':
          description: Pointlist sources
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources:
                    type: array
                    items:
                      $ref: '#/components/schemas/PointlistSource'
                  count:
                    type: integer
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/sysops:
    get:
      summary: List Sysops
      description: |
        Unique sysops with their node counts and activity statistics, filtered
        by name and paginated.
      operationId: listSysops
      tags:
        - Sysops
      parameters:
        - name: name
          in: query
          description: Filter by sysop name (substring, case-insensitive)
          schema:
            type: string
            example: "John"
        - name: limit
          in: query
          description: Maximum number of results (default 50; values above 200 are capped to 200)
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          description: Number of results to skip
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Sysops
          content:
            application/json:
              schema:
                type: object
                properties:
                  sysops:
                    type: array
                    items:
                      $ref: '#/components/schemas/SysopInfo'
                  count:
                    type: integer
                  filter:
                    type: object
                    properties:
                      name:
                        type: string
                      limit:
                        type: integer
                      offset:
                        type: integer
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/sysops/{name}/nodes:
    get:
      summary: Get Nodes by Sysop
      description: |
        All nodes operated by one sysop (exact name, URL-encoded), newest
        entry per node.
      operationId: getNodesBySysop
      tags:
        - Sysops
      parameters:
        - name: name
          in: path
          required: true
          description: Sysop name (exact match, URL-encoded)
          schema:
            type: string
            example: "John_Doe"
        - name: limit
          in: query
          description: Maximum number of results (default 100; values above 1000 are capped to 1000)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: The sysop's nodes
          content:
            application/json:
              schema:
                type: object
                properties:
                  sysop_name:
                    type: string
                  nodes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Node'
                  count:
                    type: integer
                  limit:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/stats:
    get:
      summary: Get Network Statistics
      description: |
        Node counts by type and capability, the zone distribution and the
        largest regions and nets, for one nodelist date. When `date` names a
        date with no nodelist, the nearest available date is used and
        `date_adjusted` says so.
      operationId: getStats
      tags:
        - Statistics
      parameters:
        - $ref: '#/components/parameters/DomainDefaultFidonet'
        - name: date
          in: query
          description: Nodelist date (YYYY-MM-DD); defaults to the latest
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Network statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  stats:
                    $ref: '#/components/schemas/NetworkStats'
                  domain:
                    type: string
                  requested_date:
                    type: string
                    description: The date parameter as given ("" when omitted)
                  actual_date:
                    type: string
                    format: date
                  date_adjusted:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/stats/dates:
    get:
      summary: Get Available Dates
      description: Every nodelist date in the database for one network.
      operationId: getAvailableDates
      tags:
        - Statistics
      parameters:
        - $ref: '#/components/parameters/DomainDefaultFidonet'
      responses:
        '200':
          description: Available dates
          content:
            application/json:
              schema:
                type: object
                properties:
                  dates:
                    type: array
                    items:
                      type: string
                      format: date
                  count:
                    type: integer
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/flags:
    get:
      summary: Get Flags Documentation
      description: |
        The FidoNet nodelist flags with their category and description, both
        as a map by flag and grouped by category.
      operationId: getFlagsDocumentation
      tags:
        - Reference
      parameters:
        - name: category
          in: query
          description: Only flags of this category (modem, internet, capability, filerequest, schedule, user)
          schema:
            type: string
        - name: flag
          in: query
          description: >
            A flag to make sure is described; a T-flag (Txy) absent from the
            table is described from its letters
          schema:
            type: string
            example: TAB
      responses:
        '200':
          description: Flags documentation
          content:
            application/json:
              schema:
                type: object
                properties:
                  flags:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/FlagInfo'
                  categories:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        properties:
                          flag:
                            type: string
                          has_value:
                            type: boolean
                          description:
                            type: string
                  count:
                    type: integer
                  filter:
                    type: object
                    properties:
                      category:
                        type: string

  /api/software/binkp:
    get:
      summary: Get BinkP Software Distribution
      description: |
        Which mailer software answered BinkP handshakes, by software, by
        version and by operating system, over the window.
      operationId: getBinkPSoftwareStats
      tags:
        - Software Analytics
      parameters:
        - $ref: '#/components/parameters/DomainDefaultAll'
        - $ref: '#/components/parameters/AnalyticsDays'
      responses:
        '200':
          description: BinkP software distribution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoftwareDistribution'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/software/ifcico:
    get:
      summary: Get IFCICO Software Distribution
      description: |
        Which mailer software answered EMSI (IFCICO) handshakes, by software,
        by version and by operating system, over the window.
      operationId: getIFCICOSoftwareStats
      tags:
        - Software Analytics
      parameters:
        - $ref: '#/components/parameters/DomainDefaultAll'
        - $ref: '#/components/parameters/AnalyticsDays'
      responses:
        '200':
          description: IFCICO software distribution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoftwareDistribution'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/software/binkd:
    get:
      summary: Get Binkd Version Breakdown
      description: |
        The BinkP distribution restricted to binkd, so version_breakdown is
        per binkd release.
      operationId: getBinkdDetailedStats
      tags:
        - Software Analytics
      parameters:
        - $ref: '#/components/parameters/DomainDefaultAll'
        - $ref: '#/components/parameters/AnalyticsDays'
      responses:
        '200':
          description: Binkd statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoftwareDistribution'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/analytics/geo-hosting:
    get:
      summary: Get Geographic Hosting Distribution
      description: |
        Where tested nodes are hosted, by country and by hosting provider,
        from IP geolocation of the addresses their hostnames resolved to.
      operationId: getGeoHostingStats
      tags:
        - Geographic Analytics
      parameters:
        - $ref: '#/components/parameters/DomainDefaultAll'
        - $ref: '#/components/parameters/AnalyticsDays'
      responses:
        '200':
          description: Geographic hosting distribution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoHostingDistribution'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/analytics/pingtrace:
    get:
      summary: Get Netmail PING/TRACE Report
      description: |
        Which nodes flying the PING flag answered the latest netmail PING, how long
        the round trip took, the median hop count, which TRACE nodes were confirmed
        (sent a transit notice), silent (crossed but never notified) or unobserved
        (never on a measured path), and the PING robot software seen.
      operationId: getPingTraceStats
      tags:
        - Reachability
      parameters:
        - $ref: '#/components/parameters/DomainDefaultAll'
        - name: days
          in: query
          description: Window in days (values above 3650 are capped)
          schema:
            type: integer
            default: 90
      responses:
        '200':
          description: PING/TRACE summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingTraceSummary'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/nodelist/latest:
    get:
      summary: Get Latest Nodelist
      description: |
        The newest nodelist file of one FTN network. The archive stores
        nodelists gzipped, and a compressed file is described rather than
        served: the response carries its metadata and a download_url. An
        uncompressed file is returned as text/plain instead.
      operationId: getLatestNodelist
      tags:
        - Nodelists
      parameters:
        - $ref: '#/components/parameters/DomainDefaultFidonet'
      responses:
        '200':
          description: Latest nodelist information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodelistInfo'
            text/plain:
              schema:
                type: string
                description: The nodelist itself, when the archive holds it uncompressed
        '400':
          description: The domain is not a valid FTN network name
        '404':
          description: That network has no nodelist files

  /api/cache/stats:
    get:
      summary: Cache Statistics
      description: |
        Hit/miss counters and size for the server's response cache. Registered
        only when caching is enabled in the server configuration.
      operationId: getCacheStats
      tags:
        - Operations
      responses:
        '200':
          description: Cache counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheStats'

  /api/ratelimit/stats:
    get:
      summary: Rate Limiter Statistics
      description: |
        Allowed and rejected request counts and the number of client buckets
        currently tracked. Registered only when rate limiting is enabled
        (it is unless the configuration turns it off).
      operationId: getRateLimitStats
      tags:
        - Operations
      responses:
        '200':
          description: Rate limiter counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitStats'

  /api/ftp/stats:
    get:
      summary: FTP Server Statistics
      description: |
        Listener settings of the built-in FTP server. Registered only when
        the FTP server is enabled in the server configuration.
      operationId: getFTPStats
      tags:
        - Operations
      responses:
        '200':
          description: FTP server settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FTPStats'

  /api/modem/results/direct:
    post:
      summary: Submit Modem Test Results
      description: |
        Submit results from a modem test run. Authenticated with a bearer API
        key; registered only when modem_api is enabled. A body whose
        Content-Length exceeds the configured size limit is refused with 413;
        a chunked body that grows past it is cut off and fails decoding
        (400). More results than the configured batch size is 400.
      operationId: submitModemResultsDirect
      tags:
        - Modem Testing
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [results]
              properties:
                results:
                  type: array
                  items:
                    $ref: '#/components/schemas/ModemTestResultRequest'
      responses:
        '200':
          description: Results accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: integer
                  stored:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Content-Length larger than the configured limit
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/modem/pstn-dead:
    post:
      summary: Mark a PSTN Node Dead
      description: |
        Record that a node's phone number does not answer, so later callers
        skip it. Authenticated; registered only when modem_api is enabled.
        A body whose Content-Length exceeds the configured size limit is
        refused with 413; a chunked body that grows past it fails decoding
        (400).
      operationId: markPSTNDead
      tags:
        - Modem Testing
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [zone, net, node]
              properties:
                zone:
                  type: integer
                net:
                  type: integer
                node:
                  type: integer
                reason:
                  type: string
      responses:
        '200':
          description: Node marked dead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Content-Length larger than the configured limit
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Revive a PSTN Node
      description: |
        Clear a node's dead mark so it is dialled again. Authenticated;
        registered only when modem_api is enabled. A body whose
        Content-Length exceeds the configured size limit is refused with
        413; a chunked body that grows past it fails decoding (400).
      operationId: unmarkPSTNDead
      tags:
        - Modem Testing
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [zone, net, node]
              properties:
                zone:
                  type: integer
                net:
                  type: integer
                node:
                  type: integer
      responses:
        '200':
          description: Node revived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Content-Length larger than the configured limit
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/openapi.yaml:
    get:
      summary: OpenAPI Specification
      description: This document
      operationId: getOpenAPISpec
      tags:
        - Documentation
      responses:
        '200':
          description: OpenAPI specification
          content:
            application/x-yaml:
              schema:
                type: string

  /api/docs:
    get:
      summary: API Documentation
      description: Interactive Swagger UI for this API
      operationId: getAPIDocs
      tags:
        - Documentation
      responses:
        '200':
          description: Swagger UI HTML page
          content:
            text/html:
              schema:
                type: string

components:
  schemas:
    # --- Envelopes and echoes built by the handlers themselves -------------
    AddressEnvelope:
      type: object
      description: >
        The preamble of every response about one 3-D or 4-D address: which
        network answered and which networks the address exists in.
      properties:
        address:
          type: string
          example: "2:5001/100"
        domain:
          type: string
          example: fidonet
        available_domains:
          type: array
          items:
            type: string
          description: Always an array, possibly empty
    NodeSearchFilter:
      type: object
      description: The node search's reading of its parameters (null = not applied)
      properties:
        domain:
          type: string
          nullable: true
        zone:
          type: integer
          nullable: true
        net:
          type: integer
          nullable: true
        node:
          type: integer
          nullable: true
        system_name:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        sysop_name:
          type: string
          nullable: true
        node_type:
          type: string
          nullable: true
        is_cm:
          type: boolean
          nullable: true
        is_mo:
          type: boolean
          nullable: true
        has_inet:
          type: boolean
          nullable: true
        has_binkp:
          type: boolean
          nullable: true
        date_from:
          type: string
          format: date-time
          nullable: true
        date_to:
          type: string
          format: date-time
          nullable: true
        latest_only:
          type: boolean
          nullable: true
        limit:
          type: integer
        offset:
          type: integer
    PointSearchFilter:
      type: object
      description: The point search's reading of its parameters (null = not applied)
      properties:
        zone:
          type: integer
          nullable: true
        net:
          type: integer
          nullable: true
        node:
          type: integer
          nullable: true
        point:
          type: integer
          nullable: true
        domain:
          type: string
          nullable: true
        list_source:
          type: string
          nullable: true
        system_name:
