# An isolated FidoNet zone for testing mailer software against real
# implementations.
#
# The zone has its own bridge network with fixed addresses, so every node
# answers on the port its nodelist entry would advertise (24554 binkp, 60179
# ifcico, 23 telnet) and software under test needs no port remapping -- its
# ordinary per-protocol defaults just work. Nothing is published to the host
# by default: the zone is reachable from the workstation over the bridge, and
# reaching it does not mean exposing a mailer on a host port.
#
# FTN addressing uses zone 999, which is not a real FidoNet zone, so a
# misconfigured caller can never confuse a test node for a live one.
services:
  mbse:
    build: ./mbse
    image: nodelistdb-testzone-mbse
    container_name: testzone-mbse
    hostname: mbse
    networks:
      testzone:
        ipv4_address: 172.28.0.10
    environment:
      TESTZONE_AKA: "999:1/1"
      TESTZONE_SYSTEM: "MBSE Test Node"
      TESTZONE_SYSOP: "Test Sysop"
      TESTZONE_LOCATION: "Test Zone"
      TESTZONE_FLAGS: "CM,IBN,IFC,ITN,XA"
    volumes:
      # Keeps MBSE's databases and logs across restarts, so a mailer log can
      # be read after the fact.
      - mbse-root:/opt/mbse
    restart: unless-stopped

networks:
  testzone:
    name: testzone
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  mbse-root:
