# Modem Test Configuration
# Example configuration for the modem-test CLI tool

modem:
  device: "/dev/ttyACM0"
  baud_rate: 115200
  dial_prefix: "ATDT"
  hangup_method: "dtr"  # "dtr" (drop DTR) or "escape" (+++ ATH)

  # Timeouts
  dial_timeout: 200s
  carrier_timeout: 5s
  at_command_timeout: 5s
  read_timeout: 1s

  # Init commands - executed in order during modem initialization
  # Customize these for your specific modem
  init_commands:
    - "ATZ"        # Reset modem to profile 0
    - "ATE0"       # Disable local echo
    - "ATV1"       # Verbose result codes (OK, ERROR, CONNECT, etc.)
    - "ATX4"       # Extended result codes (BUSY, NO DIALTONE, etc.)
    - "ATS0=0"     # Disable auto-answer

  # Post-disconnect commands - executed after hangup to get line statistics
  # These vary by modem manufacturer:
  #   USRobotics: AT&V1
  #   ZyXEL:      ATI11
  #   Generic:    AT+MS?
  post_disconnect_commands:
    - "AT&V1"      # Line quality stats (USRobotics modems)
    # - "ATI11"    # Alternative for ZyXEL modems

  # Delay before post-disconnect commands (modem needs time to compute stats)
  # USRobotics and most modems need 1-2 seconds after hangup
  # Based on bforce (2-3s) and qico (2.5s) implementations
  post_disconnect_delay: 2s

  # Stats profile for parsing line statistics output
  # Profiles: "rockwell" (USR/Conexant), "zyxel", "raw" (no parsing)
  stats_profile: rockwell

  # Failure report - sent after a FAILED dial to ask the modem why it failed.
  # The reply is logged, and the text after "reason=" on its "Disconnect:" line
  # is recorded as the failure detail (CSV/SQL failure_detail, API
  # failure_detail). Empty (default) = no report is requested.
  #   Software modem: ATI11 (last-call report)
  # failure_report_command: "ATI11"

  # Substrings of the failure report (case-insensitive) that mean a PERSON
  # answered the call. The modem result code VOICE always counts as well.
  # Such a call is never retried, the number is appended to
  # test.do_not_call_file and the node is marked as a voice line on the
  # NodelistDB server (when nodelistdb.url and api_key are set).
  # Default: ["voice answered"]
  # voice_answer_patterns:
  #   - "voice answered"

  # BUSY retry settings - keep retrying same number/operator on BUSY
  # busy_retry_count: 20    # Number of retries on BUSY (0 = disabled, default)
  # busy_retry_delay: 5s    # Delay between BUSY retries (default: 5s)

test:
  count: 10
  inter_delay: 5s
  # phone: "917"           # Single phone number (can be set via CLI -phone flag)
  # phones:                # Multiple phones - called in circular order
  #   - "917"
  #   - "918"
  #   - "919"

  # operators:             # Operator prefixes for routing comparison (optional)
  #   - name: "Direct"     # Friendly name for reports
  #     prefix: ""         # No prefix (direct dial)
  #   - name: "VoIP-A"
  #     prefix: "1#"       # Dial prefix to prepend
  #   - name: "VoIP-B"
  #     prefix: "2#"
  # When operators are configured, each phone is tested with all operators in sequence:
  # Test 1: 917 via Direct → ATDT917
  # Test 2: 917 via VoIP-A → ATDT1#917
  # Test 3: 917 via VoIP-B → ATDT2#917
  # Test 4: 918 via Direct → ATDT918
  # ... and so on

  # prefix_operators:           # Override operators for specific phone prefixes
  #   - phone_prefix: "7405"   # Phones starting with 7405...
  #     operators:              # ...use only MGTS
  #       - name: "MGTS"
  #         prefix: "00"
  #   - phone_prefix: "7495"   # Moscow landlines...
  #     operators:              # ...use MGTS and Telfin
  #       - name: "MGTS"
  #         prefix: "00"
  #       - name: "Telfin"
  #         prefix: "03"
  # Matching: longest prefix wins. No match = use global operators above.

  # csv_file: "modem-test-results.csv"  # Optional: output results to CSV file

  # Do-not-call list: numbers a person answered. No number in this file is
  # ever dialled, in any mode (-phone, -node, -prefix, -all, retries, operator
  # failover); voice-answered numbers are appended to it automatically.
  # Relative paths are resolved against this config file's directory (the
  # working directory when running without a config file).
  # Format: '#' comments; one number per line, tab-separated:
  #   phone (digits)<TAB>node address (may be empty)<TAB>RFC3339 time<TAB>reason
  # A line with just a phone number is enough when adding one by hand.
  # Numbers are compared as digits only, against the node's number (without
  # any operator prefix).
  # do_not_call_file: "do-not-call.txt"   # default

emsi:
  our_address: "2:5001/5001.5001"   # required: announced to every mailer we call
  system_name: "NodelistDB Tester"
  sysop: "Test"
  location: "Test"
  timeout: 30s
  protocols: []  # Empty = NCP (No Compatible Protocols - test only, no file transfer)
  # protocols: ["ZMO", "ZAP"]  # Example: ZModem protocols for actual file transfer

logging:
  debug: true
  timestamps: true
  show_rs232: true   # Show DCD/DSR/CTS/RI status changes
  show_hex: false    # Show hex dump of TX/RX data (very verbose)

# PostgreSQL results storage (optional)
# postgres_results:
#   enabled: true
#   dsn: "postgres://user:password@localhost:5432/testresults"
#   table_name: "modem_test_results"  # optional, defaults to "modem_test_results"

# MySQL results storage (optional)
# mysql_results:
#   enabled: true
#   dsn: "user:password@tcp(localhost:3306)/testresults?parseTime=true"
#   table_name: "modem_test_results"  # optional, defaults to "modem_test_results"

# AudioCodes CDR configuration (optional) - VoIP quality metrics
# Only CALL_END reports are consulted: they are the only ones carrying duration
# and the RTP quality metrics. This requires an audiocodes-cdr build that stores
# CALL_END at all (its unique key must include gw_report_type) - older ones kept
# only CALL_CONNECT, whose quality columns are all NULL or the 127 "no
# measurement" sentinel.
# cdr:
#   enabled: true
#   driver: "mysql"      # "postgres" or "mysql" (default: "postgres")
#   dsn: "user:password@tcp(localhost:3306)/voip_db?parseTime=true"  # MySQL DSN
#   # dsn: "postgres://user:password@localhost:5432/voip_db"         # PostgreSQL DSN
#   table_name: "cdr"           # optional, defaults to "cdr"
#   time_window_sec: 120        # time window for matching calls (default: 120)
#   device_id: ""               # optional: restrict to one gateway when the CDR
#                               # database serves several (empty = any device)

# Asterisk CDR configuration (optional) - call routing info
# asterisk_cdr:
#   enabled: true
#   driver: "mysql"      # "postgres" or "mysql" (default: "postgres")
#   dsn: "user:password@tcp(localhost:3306)/asterisk?parseTime=true"  # MySQL DSN
#   # dsn: "postgres://user:password@localhost:5432/asterisk"         # PostgreSQL DSN
#   table_name: "cdr"           # optional, defaults to "cdr"
#   time_window_sec: 120        # time window for matching calls (default: 120)
